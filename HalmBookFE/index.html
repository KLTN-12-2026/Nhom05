<!doctype html>
<html lang="vi" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var isAdmin = window.location.pathname.startsWith('/admin');
        if (isAdmin) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          ['color-theme', 'halm-theme', 'halm_theme', 'theme'].forEach(function (key) {
            localStorage.setItem(key, 'dark');
          });
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* User: Triệt tiêu 100% hiện tượng hắt sáng và nhấp nháy trắng khi F5 ở chế độ tối của User */
    html:not(.light).dark,
    html:not(.light).dark body,
    html:not(.light).dark #root {
      background-color: #111210 !important;
      color: #EDE9DF !important;
      color-scheme: dark;
    }
    html:not(.light).dark .user-sidebar-box * {
      color: #EDE9DF !important;
    }
    html:not(.light).dark .user-sidebar-box span.text-xs,
    html:not(.light).dark .user-sidebar-box span:last-child {
      color: #9CA3AF !important;
    }

    /* Admin: Khôi phục Light Mode chuyên nghiệp, sáng sủa, sắc nét */
    html.light,
    html.light body,
    html.light #root,
    .admin-page-root {
      background-color: #f8fafc !important;
      color: #0f172a !important;
      color-scheme: light !important;
    }
    html.light,
    html.light *,
    .admin-page-root,
    .admin-page-root * {
      scrollbar-color: #cbd5e1 #f8fafc !important;
      scrollbar-width: thin !important;
    }
    html.light::-webkit-scrollbar,
    html.light *::-webkit-scrollbar,
    .admin-page-root *::-webkit-scrollbar {
      width: 6px !important;
      height: 6px !important;
    }
    html.light::-webkit-scrollbar-track,
    html.light *::-webkit-scrollbar-track,
    .admin-page-root *::-webkit-scrollbar-track {
      background: #f8fafc !important;
    }
    html.light::-webkit-scrollbar-thumb,
    html.light *::-webkit-scrollbar-thumb,
    .admin-page-root *::-webkit-scrollbar-thumb {
      background-color: #cbd5e1 !important;
      border-radius: 9999px !important;
    }
    html.light::-webkit-scrollbar-thumb:hover,
    html.light *::-webkit-scrollbar-thumb:hover,
    .admin-page-root *::-webkit-scrollbar-thumb:hover {
      background-color: #94a3b8 !important;
    }
  </style>
