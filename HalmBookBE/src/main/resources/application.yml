server:
  port: 8082
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  application:
    name: HalmBookBE
  ai:
    openai:
      api-key: ${GEMINI_KEY:mock_gemini_key}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-3.6-flash
          max-tokens: 2048

  # Cấu hình database nguyên vẹn của bạn
  datasource:
    url: jdbc:mysql://localhost:3107/halmbook?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Khối mail đã được lùi vào đúng cấp của thẻ spring
  mail:
    host: smtp.gmail.com
    port: 587
    username: buihuonga33w@gmail.com
    password: ${MAIL_PASSWORD:mock_mail_password}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
          starttls:
            enable: true
            required: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:mock_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:mock_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:mock_api_secret}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:mock_google_id}
    secret: ${GOOGLE_CLIENT_SECRET:mock_google_secret}

jwt:
    secret: ${JWT_SECRET:HALMBOOK_Super_Secret_Key_For_JWT_Authentication_2026_Must_Be_Long}
    expiration: 86400000 # Thời gian sống của Token (1 ngày = 86400000 ms)
