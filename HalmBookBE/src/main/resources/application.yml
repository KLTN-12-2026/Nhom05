server:
  port: 8082
  tomcat:
    max-swallow-size: 120MB
    max-http-form-post-size: 120MB
spring:
  main:
    allow-circular-references: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 120MB
  application:
    name: HalmBookBE
  ai:
    openai:
      api-key: ${GEMINI_KEY:default-gemini-key}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      # AiChatConfig also copies these limits to per-request options for Spring AI 2.0.1.
      timeout: ${AI_REQUEST_TIMEOUT:20s}
      max-retries: ${AI_MAX_RETRIES:1}
      chat:
        completions-path: /chat/completions
        timeout: ${AI_REQUEST_TIMEOUT:20s}
        max-retries: ${AI_MAX_RETRIES:1}
        options:
          model: ${GEMINI_MODEL:gemini-3.6-flash}
          max-tokens: 2048

  # MySQL local uses 3306. Override with DB_URL or Spring's SPRING_DATASOURCE_URL.
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/halmbook?connectTimeout=5000&socketTimeout=30000}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Cấu hình RabbitMQ Message Broker
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 500ms
          multiplier: 2
          max-interval: 2s

  # Khối mail đã được lùi vào đúng cấp của thẻ spring
  mail:
    default-encoding: UTF-8
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:buihuonga33w@gmail.com}
    password: ${MAIL_PASSWORD:dummy_password}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
          starttls:
            enable: true
            required: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:halmbook}
  api-key: ${CLOUDINARY_API_KEY:123456789}
  api-secret: ${CLOUDINARY_API_SECRET:secret}

google:
  client:
    id: ${GOOGLE_CLIENT_ID:dummy-id}
    secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}

jwt:
    secret: ${JWT_SECRET:HALMBOOK_Super_Secret_Key_For_JWT_Authentication_2026_Must_Be_Long}
    expiration: 86400000 # Thời gian sống của Token (1 ngày = 86400000 ms)

halm:
  support:
    confirmation-email:
      enabled: ${SUPPORT_EMAIL_ENABLED:true}

logging:
  charset:
    console: UTF-8
